    </text>
  </g>

  <!-- Telemetry HUD Markings -->
  <g font-family="monospace" font-size="11" fill="#0284c7" opacity="0.7">
    <text x="70" y="70">SYS_ID: IND-DPDP-2026 // NODE: HYD-BLR-DEL</text>
    <text x="70" y="90">ENCRYPTION: QUANTUM-RESISTANT 4096-BIT</text>
    <text x="1850" y="70" text-anchor="end">SOVEREIGN_CLOUD: ACTIVE [100%]</text>
    <text x="1850" y="90" text-anchor="end">FIREWALL: BORDERLESS CITADEL</text>
