  <circle cx="960" cy="360" r="18" fill="#ffffff" filter="url(#strongGlow)" opacity="0.6" />

  <!-- Outer Viewport Framing -->
  <rect x="25" y="25" width="1870" height="1030" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.2" rx="8" />
  <path d="M 25 55 L 25 25 L 55 25" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1895 55 L 1895 25 L 1865 25" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 25 1025 L 25 1055 L 55 1055" fill="none" stroke="#00f2fe" stroke-width="3" />
  <path d="M 1895 1025 L 1895 1055 L 1865 1055" fill="none" stroke="#00f2fe" stroke-width="3" />
</svg>
