<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#030712" />
      <stop offset="40%" stop-color="#081026" />
      <stop offset="70%" stop-color="#0c1938" />
      <stop offset="100%" stop-color="#02040a" />
    </linearGradient>
    
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.22" />
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.15" />
      <stop offset="70%" stop-color="#0f172a" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="tricolorGlow" cx="50%" cy="42%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="25%" stop-color="#38bdf8" stop-opacity="0.18" />
      <stop offset="60%" stop-color="#0284c7" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Metallic & Neon Text Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f0f9ff" />
      <stop offset="85%" stop-color="#bae6fd" />
      <stop offset="100%" stop-color="#7dd3fc" />
    </linearGradient>

    <linearGradient id="goldTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="chartGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="80%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="chartAreaGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="saffronGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF9933" />
      <stop offset="100%" stop-color="#FFB366" />
    </linearGradient>

    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#138808" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>

    <filter id="glowFilter" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="textShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#0284c7" stroke-width="0.75" stroke-opacity="0.15" />
    </pattern>
  </defs>

  <!-- Deep Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grid overlay in perspective -->
  <rect width="1920" height="1080" fill="url(#grid)" opacity="0.8" />

  <!-- Center radial spotlight glows -->
  <rect width="1920" height="1080" fill="url(#centerGlow)" />
  <rect width="1920" height="1080" fill="url(#tricolorGlow)" />

  <!-- Background Cyber Circuit Lines -->
  <g stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.3" fill="none">
    <path d="M 0 250 L 320 250 L 420 350 L 750 350" />
    <circle cx="320" cy="250" r="4" fill="#38bdf8" />
    <circle cx="420" cy="350" r="4" fill="#38bdf8" />
    <circle cx="750" cy="350" r="6" fill="#00f2fe" filter="url(#glowFilter)" />

    <path d="M 1920 250 L 1600 250 L 1500 350 L 1170 350" />
    <circle cx="1600" cy="250" r="4" fill="#38bdf8" />
    <circle cx="1500" cy="350" r="4" fill="#38bdf8" />
    <circle cx="1170" cy="350" r="6" fill="#00f2fe" filter="url(#glowFilter)" />

    <path d="M 150 1080 L 150 850 L 300 700 L 600 700" />
    <circle cx="300" cy="700" r="4" fill="#38bdf8" />
    <circle cx="600" cy="700" r="5" fill="#38bdf8" />

    <path d="M 1770 1080 L 1770 850 L 1620 700 L 1320 700" />
    <circle cx="1620" cy="700" r="4" fill="#38bdf8" />
    <circle cx="1320" cy="700" r="5" fill="#38bdf8" />
  </g>

  <!-- Left Server Stack / Data Citadel Bastion -->
  <g transform="translate(140, 260)" opacity="0.75">
    <rect x="0" y="0" width="180" height="420" rx="12" fill="#091428" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Server Blades -->
    <g fill="#0f2142">
      <rect x="15" y="25" width="150" height="25" rx="4" />
      <rect x="15" y="60" width="150" height="25" rx="4" />
      <rect x="15" y="95" width="150" height="25" rx="4" />
      <rect x="15" y="130" width="150" height="25" rx="4" />
      <rect x="15" y="165" width="150" height="25" rx="4" />
      <rect x="15" y="200" width="150" height="25" rx="4" />
      <rect x="15" y="235" width="150" height="25" rx="4" />
      <rect x="15" y="270" width="150" height="25" rx="4" />
      <rect x="15" y="305" width="150" height="25" rx="4" />
      <rect x="15" y="340" width="150" height="25" rx="4" />
      <rect x="15" y="375" width="150" height="25" rx="4" />
    </g>
    <!-- Blinking status lights -->
    <g>
      <circle cx="30" cy="37" r="3" fill="#22c55e" />
      <circle cx="42" cy="37" r="3" fill="#06b6d4" />
      <circle cx="30" cy="72" r="3" fill="#22c55e" />
      <circle cx="42" cy="72" r="3" fill="#38bdf8" />
      <circle cx="30" cy="107" r="3" fill="#38bdf8" />
      <circle cx="42" cy="107" r="3" fill="#22c55e" />
      <circle cx="30" cy="142" r="3" fill="#eab308" />
      <circle cx="42" cy="142" r="3" fill="#22c55e" />
      <circle cx="30" cy="177" r="3" fill="#22c55e" />
      <circle cx="42" cy="177" r="3" fill="#06b6d4" />
      <circle cx="30" cy="212" r="3" fill="#22c55e" />
      <circle cx="42" cy="212" r="3" fill="#38bdf8" />
      <circle cx="30" cy="247" r="3" fill="#22c55e" />
      <circle cx="42" cy="247" r="3" fill="#22c55e" />
      <circle cx="30" cy="282" r="3" fill="#38bdf8" />
      <circle cx="42" cy="282" r="3" fill="#06b6d4" />
      <circle cx="30" cy="317" r="3" fill="#22c55e" />
      <circle cx="42" cy="317" r="3" fill="#22c55e" />
      <circle cx="30" cy="352" r="3" fill="#38bdf8" />
      <circle cx="42" cy="352" r="3" fill="#22c55e" />
      <circle cx="30" cy="387" r="3" fill="#22c55e" />
      <circle cx="42" cy="387" r="3" fill="#38bdf8" />
    </g>
  </g>

  <!-- Right Server Stack / Bastion -->
  <g transform="translate(1600, 260)" opacity="0.75">
    <rect x="0" y="0" width="180" height="420" rx="12" fill="#091428" stroke="#0ea5e9" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Server Blades -->
    <g fill="#0f2142">
      <rect x="15" y="25" width="150" height="25" rx="4" />
      <rect x="15" y="60" width="150" height="25" rx="4" />
      <rect x="15" y="95" width="150" height="25" rx="4" />
      <rect x="15" y="130" width="150" height="25" rx="4" />
      <rect x="15" y="165" width="150" height="25" rx="4" />
      <rect x="15" y="200" width="150" height="25" rx="4" />
      <rect x="15" y="235" width="150" height="25" rx="4" />
      <rect x="15" y="270" width="150" height="25" rx="4" />
      <rect x="15" y="305" width="150" height="25" rx="4" />
      <rect x="15" y="340" width="150" height="25" rx="4" />
      <rect x="15" y="375" width="150" height="25" rx="4" />
