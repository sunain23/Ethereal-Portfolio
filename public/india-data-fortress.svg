  <!-- Lower Third Subtitle Bar -->
  <g transform="translate(960, 930)">
    <rect x="-470" y="-26" width="940" height="52" rx="14" 
          fill="#040b19" fill-opacity="0.9" 
          stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.4" 
          filter="url(#textShadow)" />
    
