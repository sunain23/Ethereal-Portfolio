    <text x="15" y="7" 
          fill="#e2e8f0" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" 
          font-weight="600" font-size="18" letter-spacing="1" text-anchor="middle">
