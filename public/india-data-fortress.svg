  <!-- Central Holographic Cyber Shield / Fortress Gate -->
  <g transform="translate(960, 360)">
    <!-- Outer energy forcefield ring -->
    <circle cx="0" cy="0" r="230" fill="none" stroke="#00f2fe" stroke-width="2" stroke-dasharray="14 10" stroke-opacity="0.4" />
    <circle cx="0" cy="0" r="215" fill="none" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.3" />
    <circle cx="0" cy="0" r="185" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glowFilter)" />

    <!-- Isometric Fortress Battlement Shape (Shield Outline) -->
    <path d="M 0 -160 L 140 -80 L 140 70 L 0 170 L -140 70 L -140 -80 Z" 
          fill="#0c2340" fill-opacity="0.75" 
          stroke="#00f2fe" stroke-width="3.5" 
          filter="url(#glowFilter)" />

    <!-- Inner Shield Armor Plates -->
    <path d="M 0 -130 L 115 -65 L 115 55 L 0 140 L -115 55 L -115 -65 Z" 
          fill="none" 
          stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="8 6" stroke-opacity="0.6" />

    <!-- Indian Tricolor Subtle Energy Rings / Accents -->
    <!-- Top saffron arc -->
    <path d="M -80 -100 Q 0 -140 80 -100" fill="none" stroke="url(#saffronGrad)" stroke-width="4.5" filter="url(#glowFilter)" />
    <!-- Bottom green arc -->
    <path d="M -80 100 Q 0 140 80 100" fill="none" stroke="url(#greenGrad)" stroke-width="4.5" filter="url(#glowFilter)" />

    <!-- Central Radiant Ashoka Chakra / Security Vault Emblem (24 Spokes) -->
    <circle cx="0" cy="0" r="46" fill="#040c1a" stroke="#ffffff" stroke-width="2.5" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="14" fill="#00f2fe" filter="url(#glowFilter)" />
    <circle cx="0" cy="0" r="6" fill="#ffffff" />
    <g stroke="#ffffff" stroke-width="1.5" opacity="0.85">
      <line x1="14.00" y1="0.00" x2="46.00" y2="0.00" />
      <line x1="13.52" y1="3.62" x2="44.43" y2="11.91" />
      <line x1="12.12" y1="7.00" x2="39.84" y2="23.00" />
      <line x1="9.90" y1="9.90" x2="32.53" y2="32.53" />
      <line x1="7.00" y1="12.12" x2="23.00" y2="39.84" />
      <line x1="3.62" y1="13.52" x2="11.91" y2="44.43" />
      <line x1="0.00" y1="14.00" x2="0.00" y2="46.00" />
      <line x1="-3.62" y1="13.52" x2="-11.91" y2="44.43" />
      <line x1="-7.00" y1="12.12" x2="-23.00" y2="39.84" />
      <line x1="-9.90" y1="9.90" x2="-32.53" y2="32.53" />
      <line x1="-12.12" y1="7.00" x2="-39.84" y2="23.00" />
      <line x1="-13.52" y1="3.62" x2="-44.43" y2="11.91" />
      <line x1="-14.00" y1="0.00" x2="-46.00" y2="0.00" />
      <line x1="-13.52" y1="-3.62" x2="-44.43" y2="-11.91" />
      <line x1="-12.12" y1="-7.00" x2="-39.84" y2="-23.00" />
      <line x1="-9.90" y1="-9.90" x2="-32.53" y2="-32.53" />
      <line x1="-7.00" y1="-12.12" x2="-23.00" y2="-39.84" />
      <line x1="-3.62" y1="-13.52" x2="-11.91" y2="-44.43" />
      <line x1="-0.00" y1="-14.00" x2="-0.00" y2="-46.00" />
      <line x1="3.62" y1="-13.52" x2="11.91" y2="-44.43" />
      <line x1="7.00" y1="-12.12" x2="23.00" y2="-39.84" />
      <line x1="9.90" y1="-9.90" x2="32.53" y2="-32.53" />
      <line x1="12.12" y1="-7.00" x2="39.84" y2="-23.00" />
      <line x1="13.52" y1="-3.62" x2="44.43" y2="-11.91" />
    </g>

    <!-- Glowing digital keyhole / data lock symbol -->
    <path d="M 0 -22 C -6 -22 -10 -18 -10 -12 C -10 -7.5 -7.5 -4 -4 -2.5 L -5 12 L 5 12 L 4 -2.5 C 7.5 -4 10 -7.5 10 -12 C 10 -18 6 -22 0 -22 Z" 
          fill="#ffffff" opacity="0.95" filter="url(#glowFilter)" />

    <!-- Data Streams Radiating from Center -->
    <line x1="-140" y1="0" x2="-260" y2="0" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.7" />
    <line x1="140" y1="0" x2="260" y2="0" stroke="#00f2fe" stroke-width="2" stroke-dasharray="6 4" stroke-opacity="0.7" />
  </g>

  <!-- Stock Market / Economic Data Chart (Surging Upwards) -->
  <g transform="translate(280, 530)" opacity="0.9">
    <!-- Chart Background Area Fill -->
    <path d="M 0 150 L 140 120 L 280 135 L 420 90 L 560 110 L 700 40 L 840 60 L 980 -20 L 1120 10 L 1260 -70 L 1360 -110 L 1360 170 L 0 170 Z" 
          fill="url(#chartAreaGrad)" />
    
    <!-- Neon Chart Trend Line -->
    <path d="M 0 150 L 140 120 L 280 135 L 420 90 L 560 110 L 700 40 L 840 60 L 980 -20 L 1120 10 L 1260 -70 L 1360 -110" 
          fill="none" stroke="url(#chartGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" 
          filter="url(#strongGlow)" />

    <!-- Chart Nodes & High Points -->
    <circle cx="420" cy="90" r="5" fill="#ffffff" filter="url(#glowFilter)" />
    <circle cx="700" cy="40" r="5" fill="#ffffff" filter="url(#glowFilter)" />
    <circle cx="980" cy="-20" r="6" fill="#38bdf8" filter="url(#glowFilter)" />
    <circle cx="1260" cy="-70" r="6" fill="#00f2fe" filter="url(#glowFilter)" />
    <circle cx="1360" cy="-110" r="8" fill="#ffffff" filter="url(#strongGlow)" />

    <!-- Growth indicator flag -->
    <g transform="translate(1360, -110)">
      <rect x="15" y="-30" width="110" height="32" rx="6" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5" />
      <text x="70" y="-9" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-weight="900" font-size="16" text-anchor="middle">+148% ▲</text>
    </g>
  </g>

  <!-- Top Pill / Editorial Tag -->
  <g transform="translate(960, 115)">
    <rect x="-240" y="-22" width="480" height="44" rx="22" 
          fill="#030b1e" fill-opacity="0.85" 
          stroke="#00f2fe" stroke-width="1.5" stroke-opacity="0.6" filter="url(#textShadow)" />
    <circle cx="-210" cy="0" r="5" fill="#22c55e" filter="url(#glowFilter)" />
    <text x="0" y="5" 
          fill="#38bdf8" 
          font-family="system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" 
          font-weight="800" font-size="14" letter-spacing="4" text-anchor="middle">
      DATA SOVEREIGNTY // EDITORIAL SPECIAL
    </text>
  </g>

  <!-- Main Headline Typography -->
  <!-- Line 1: INDIA IS BUILDING A -->
  <text x="960" y="730" 
        fill="#f8fafc" 
        font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" font-size="44" letter-spacing="8" text-anchor="middle" 
        filter="url(#textShadow)">
    INDIA IS BUILDING A
  </text>

  <!-- Line 2: FORTRESS FOR INDIAN DATA -->
