    <!-- Blinking status lights -->
    <g>
      <circle cx="150" cy="37" r="3" fill="#22c55e" />
      <circle cx="138" cy="37" r="3" fill="#06b6d4" />
      <circle cx="150" cy="72" r="3" fill="#22c55e" />
      <circle cx="138" cy="72" r="3" fill="#38bdf8" />
      <circle cx="150" cy="107" r="3" fill="#38bdf8" />
      <circle cx="138" cy="107" r="3" fill="#22c55e" />
      <circle cx="150" cy="142" r="3" fill="#eab308" />
      <circle cx="138" cy="142" r="3" fill="#22c55e" />
      <circle cx="150" cy="177" r="3" fill="#22c55e" />
      <circle cx="138" cy="177" r="3" fill="#06b6d4" />
      <circle cx="150" cy="212" r="3" fill="#22c55e" />
      <circle cx="138" cy="212" r="3" fill="#38bdf8" />
      <circle cx="150" cy="247" r="3" fill="#22c55e" />
      <circle cx="138" cy="247" r="3" fill="#22c55e" />
      <circle cx="150" cy="282" r="3" fill="#38bdf8" />
      <circle cx="138" cy="282" r="3" fill="#06b6d4" />
      <circle cx="150" cy="317" r="3" fill="#22c55e" />
      <circle cx="138" cy="317" r="3" fill="#22c55e" />
      <circle cx="150" cy="352" r="3" fill="#38bdf8" />
      <circle cx="138" cy="352" r="3" fill="#22c55e" />
      <circle cx="150" cy="387" r="3" fill="#22c55e" />
      <circle cx="138" cy="387" r="3" fill="#38bdf8" />
    </g>
